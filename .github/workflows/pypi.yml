name: PyPI

# Separate from release.yml, which builds the Windows and Linux installers with write access and
# third-party actions. The trusted publisher is bound to this file, so PyPI upload rights stay out
# of that pipeline.

on:
  push:
    tags:
      - "v*.*.*"
  # A change to the release path is proved here, up to the upload, before it can reach a tag.
  pull_request:
    paths:
      - ".github/workflows/pypi.yml"
      - "build-constraints.txt"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  # Nothing unlocked runs where the published files are made: build-constraints.txt pins the build
  # backend by hash, and this job installs nothing else.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      # PyPI never lets a version be reused, so catch mistakes here. This check and the version
      # check below are not a security boundary, because a tagged commit can edit this file. The
      # repository's tag ruleset and the pypi environment's tag policy restrict publishing.
      - name: Refuse a tag that is not on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build package
        run: uv build --python 3.12 --build-constraint build-constraints.txt --require-hashes

      - name: Refuse a tag that does not match the package version
        if: github.ref_type == 'tag'
        run: test -f "dist/rflect-${GITHUB_REF_NAME#v}-py3-none-any.whl"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Check the package metadata
        run: uvx twine check --strict dist/*

      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # uv would otherwise take the runner's system Python for 3.12, which has no tkinter.
      - name: Install the wheel
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv venv --managed-python --python "$PYTHON_VERSION" wheel-env
          uv pip install --python wheel-env/bin/python dist/*.whl

      - name: Open the GUI from the installed wheel
        run: |
          cat > launch.py <<'PY'
          import os
          import threading
          from importlib.metadata import distribution, version

          import plot_antenna

          assert plot_antenna.__version__ == version("rflect"), plot_antenna.__version__
          command = next(e for e in distribution("rflect").entry_points if e.name == "rflect")

          # The GUI points stdout at a Tk widget, so a worker thread must not print.
          def stop():
              os.write(1, b"GUI still running after 8 seconds\n")
              os._exit(0)

          threading.Timer(8, stop).start()
          command.load()()
          os.write(2, b"the GUI exited early\n")
          os._exit(1)
          PY
          xvfb-run -a wheel-env/bin/python launch.py

  publish:
    if: github.ref_type == 'tag'
    needs: [build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/rflect
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
